services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finova}
      POSTGRES_USER: ${POSTGRES_USER:-finova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finova-dev-only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - finova-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - finova-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  finova-postgres:
  finova-redis:
